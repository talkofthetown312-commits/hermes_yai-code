plugins { id 'com.android.application' }
// Secrets stay outside the source tree. Retain this key for all future updates.
def pocketSigningFile = new File(System.getProperty('user.home'), '.hermes-pocket/signing/release.properties')
def pocketSigning = new Properties()
if (pocketSigningFile.isFile()) pocketSigningFile.withInputStream { pocketSigning.load(it) }
android {
    namespace 'com.hermespocket.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.hermespocket.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        if (pocketSigningFile.isFile()) {
            release {
                storeFile file(pocketSigning['storeFile'])
                storeType pocketSigning['storeType']
                storePassword pocketSigning['storePassword']
                keyAlias pocketSigning['keyAlias']
                keyPassword pocketSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (pocketSigningFile.isFile()) signingConfig signingConfigs.release
        }
    }
}
