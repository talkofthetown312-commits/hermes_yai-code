name: Source checks

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-source:
    name: Source + offline integration (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out PR source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node for offline syntax and simulated-DOM checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Static source, exclusion and credential-pattern checks
        run: python -B tools/check_source.py
      - name: Test the checker using generated fixtures only
        run: python -B -m unittest discover -s tools -p test_check_source.py -v
      - name: Complete offline Phase 1-3 suite in a disposable source copy
        run: python -B tools/run_phase3_checks.py
      - name: Ensure checks did not change tracked source
        run: git diff --exit-code HEAD --
